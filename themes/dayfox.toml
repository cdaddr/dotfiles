# dayfox (light, nightfox family)
# generated by ai

[colors]
# Dayfox is a LIGHT theme, so it needs the same split Catppuccin Latte uses: the
# backgrounds are lighter than every ANSI grey, so the ANSI ramp and the UI
# bg/fg scale can't share names.
#
#   * black/grey/white/bright_white -> the ANSI 16-color slots (color0/8/7/15),
#     taken from the official Dayfox terminal port (iTerm2-Color-Schemes): "black"
#     stays dark, "white" stays light, so ANSI-colored text renders correctly.
#   * grey_dark..grey_darker + fg    -> the UI background/foreground scale (Dayfox
#     bg0-2 / fg1), used via the bg/bg_*/fg aliases below.
#
# As with latte, the ramp names do NOT track absolute lightness here — each name
# serves its consumers' ROLE, not its literal shade.
black        = "352c24"  # color0  (dark)
grey         = "534c45"  # color8  (bright black)
white        = "bfb6ae"  # color7  (light grey)
bright_white = "f4ece6"  # color15 (lightest)

# background/UI scale — not part of the ANSI ramp
grey_darker  = "f6f2ee"  # bg1  (main background)
grey_darkest = "e4dcd4"  # bg0  (dimmer background)
grey_dark    = "dbd1dd"  # bg2  (emphasis background)
grey_dim     = "aab0ad"  # bg4  (muted UI / de-emphasized text)

red          = "a5222f"  # color1
orange       = "955f61"  # Dayfox orange
yellow       = "ac5402"  # color3
green        = "396847"  # color2
cyan         = "287980"  # color6
blue         = "2848a9"  # color4
purple       = "6e33ce"  # color5 (magenta)
pink         = "a440b5"  # Dayfox pink

# bright variants (color9-14 from the official port)
bright_red    = "b3434e"
bright_orange = "b86e28"
bright_yellow = "b86e28"
bright_green  = "577f63"
bright_cyan   = "488d93"
bright_blue   = "4863b6"
bright_purple = "8452d5"

# semantic aliases
# fg is a literal (fg1): darker than every ANSI grey, so it can't alias a ramp
# slot (bright_white here is the light color15).
fg        = "3d2b5a"      # fg1
bg        = "$grey_darker"
bg_dim    = "$grey_darkest"
bg_bright = "$grey_dark"
primary   = "$blue"
path      = "$pink"
accent    = "$purple"
error     = "$red"
comment   = "837a72"      # Dayfox comment
text      = "$fg"

[kitty]
# mirrors the light-theme tab styling used by catppuccin-latte: soft grey fills,
# blue index pill, a saturated purple active-title, dark readable inactive text,
# and a higher inactive_text_alpha so dimmed splits stay legible on the light bg.
# cursor + selection follow the official Dayfox terminal port (dark selection).
font_size             = "20"
inactive_text_alpha   = "0.9"
cursor                = "$fg"
selection_fg          = "$bg"
selection_bg          = "$fg"
url_color             = "$blue"
active_tab_fg         = "$fg"
active_tab_bg         = "$grey_dark"
inactive_tab_fg       = "$grey"
inactive_tab_bg       = "$grey_darkest"
active_border_color   = "$blue"
inactive_border_color = "$grey_dim"
tab_inactive_index_fg = "$grey"
tab_inactive_index_bg = "$grey_dark"
tab_inactive_title_bg = "$grey_darkest"
tab_inactive_title_fg = "$grey"
tab_active_index_bg   = "$primary"
tab_active_index_fg   = "$grey_darker"
tab_active_title_bg   = "$purple"
tab_active_title_fg   = "ffffff"

[nvim]
theme   = "dayfox"
lualine = "dayfox"

[wezterm]
theme = "Dayfox"

[vivid]
theme = "current"

[bat]
# Dayfox is not a built-in bat theme; fall back to the closest light theme.
theme = "Catppuccin Latte"

[less]
# fixed-cube dark fg (16) so search text stays readable on the light highlight
search_bg = "\\e[48;5;183m"
search_fg = "\\e[38;5;16m"
