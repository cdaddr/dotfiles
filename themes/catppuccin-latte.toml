# catppuccin latte (light)
# generated by ai

[colors]
# Latte is a LIGHT theme and needs the palette split in a way the dark flavors
# don't. In a dark flavor the background IS the dark end of the ANSI ramp
# (color0 = Crust), so one ramp serves both the ANSI block and the bg/fg
# aliases. In Latte the backgrounds (Base/Mantle/Crust) are LIGHTER than every
# ANSI grey, so the two roles diverge:
#
#   * black/grey/white/bright_white -> the ANSI 16-color slots (color0/8/7/15),
#     matching catppuccin's official kitty latte port: "black" stays dark,
#     "white" stays light, so ANSI-colored text renders correctly.
#   * grey_dark..grey_darker + fg    -> the UI background/foreground scale, used
#     via the bg/bg_*/fg aliases below.
#
# Consequence: for this theme the ramp names do NOT track absolute lightness —
# each name is chosen to satisfy its consumers' ROLE, not its literal shade.
black = "5c5f77"        # Subtext1  (ANSI color0)
grey = "6c6f85"         # Subtext0  (ANSI color8 / bright black)
white = "acb0be"        # Surface2  (ANSI color7)
bright_white = "bcc0cc" # Surface1  (ANSI color15 / bright white)

# background/UI scale — not part of the ANSI ramp
grey_darker = "eff1f5"  # Base    (main background)
grey_darkest = "e6e9ef" # Mantle
grey_dark = "ccd0da"    # Surface0
grey_dim = "9ca0b0"     # Overlay0 (muted UI / de-emphasized text)

red = "d20f39"    # Red
orange = "fe640b" # Peach
yellow = "df8e1d" # Yellow
green = "40a02b"  # Green
cyan = "179299"   # Teal
blue = "1e66f5"   # Blue
purple = "8839ef" # Mauve
pink = "ea76cb"   # Pink

# bright variants (catppuccin latte has no distinct brights for most colors)
bright_red = "d20f39"    # Red
bright_orange = "e64553" # Maroon
bright_yellow = "df8e1d" # Yellow
bright_green = "40a02b"  # Green
bright_cyan = "179299"   # Teal
bright_blue = "1e66f5"   # Blue
bright_purple = "8839ef" # Mauve

# theme-specific extras
lavender = "7287fd"  # Lavender
overlay1 = "8c8fa1"  # Overlay1
rosewater = "dc8a78" # Rosewater

# semantic aliases
# fg is a literal (Text): it is darker than every ANSI grey, so unlike the dark
# flavors it can't be aliased to bright_white (which here is the light color15).
fg = "4c4f69"            # Text
bg = "$grey_darker"
bg_dim = "$grey_darkest"
bg_bright = "$grey_dark"
primary = "$blue"
path = "$pink"
accent = "$lavender"
error = "$red"
comment = "$overlay1"
text = "$fg"

[kitty]
# tabs/borders are tuned softer than catppuccin's official latte port: its
# saturated Mauve active tab and lavender/overlay borders read as loud and
# low-contrast on a light bg. Active tab = soft Surface0 fill + blue index pill;
# inactive = dark readable text on subtle light greys; borders = saturated blue
# (active) vs muted Overlay0 (inactive) so the two are clearly distinct.
# cursor + selection follow the official port (Rosewater).
font_size = "20"
inactive_text_alpha = "0.9"
cursor = "$rosewater"
selection_fg = "$grey_darker"
selection_bg = "$rosewater"
url_color = "$blue"
active_tab_fg = "$fg"
active_tab_bg = "$grey_dark"
inactive_tab_fg = "$grey"
inactive_tab_bg = "$grey_darkest"
active_border_color = "$blue"
inactive_border_color = "$grey_dim"
tab_inactive_index_fg = "$grey"
tab_inactive_index_bg = "$grey_dark"
tab_inactive_title_bg = "$grey_darkest"
tab_inactive_title_fg = "$grey"
tab_active_index_bg = "$primary"
tab_active_index_fg = "$grey_darker"
tab_active_title_bg = "$purple"
tab_active_title_fg = "ffffff"

[nvim]
theme = "catppuccin-latte"
lualine = "catppuccin-latte"

[wezterm]
theme = "Catppuccin Latte"

[vivid]
theme = "current"

[bat]
theme = "Catppuccin Latte"

[less]
# fixed-cube dark fg (16) so search text stays readable on the light highlight
search_bg = "\\e[48;5;183m"
search_fg = "\\e[38;5;16m"
